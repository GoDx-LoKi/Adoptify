{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
  body {
  
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
  }

  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 90vh;

    position: relative;
    overflow: hidden;
    padding: 2rem;
  }

  .hero h1 {
    font-size: 3rem;
    font-weight: 800;
    color: #ffcc70;
  }

  .hero p {
    font-size: 1.2rem;
    color: #ccc;
    max-width: 700px;
    margin-top: 1rem;
  }

  .cta-btn {
    margin-top: 2rem;
    background-color: #ffcc70;
    color: #1f1f1f;
    padding: 0.8rem 1.5rem;
    border: none;
    font-weight: 600;
    border-radius: 8px;
    transition: all 0.3s ease-in-out;
  }

  .cta-btn:hover {
    background-color: #ffd88a;
    transform: scale(1.05);
  }

  .hero-image {
    max-width: 450px;
    margin-top: 2rem;
  }

  .confetti {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('{% static "img/confetti.svg" %}') repeat;
    opacity: 0.08;
    pointer-events: none;
  }
</style>

<div class="hero">
  <div class="confetti"></div>
  <h1>Adopt. Love. Repeat.</h1>
  <p>Find your perfect pet companion from loving shelters around you. Because every pet deserves a home, and every home deserves a friend.</p>
  <a href="{% url 'pets' %}"><button class="cta-btn">Adopt a Pet</button></a>
  <img src="https://img.icons8.com/?size=100&id=67949&format=png&color=000000" alt="Happy Pets" class="hero-image">
</div>
{% endblock %}
