{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adoptify</title>
  
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  
  <style>
    /* Dark theme styles */
    body {
      
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #1f1f1f, #2e2e2e);
      color: #e0e0e0;
    }
    
    .navbar {
      background-color: #1e1e1e !important;
    }
    .navbar-brand, .nav-link {
      color: #ffffff !important;
    }
    .nav-link:hover {
      color: #D84040 !important;
    }
    
   
    
    .footer {
      background-color: #1e1e1e;
      color: #e0e0e0;
      padding: 10px 0;
    }


    #custom-cursor {
    position: fixed;
    width: 12px;
    height: 12px;
    background-color: #f5c242;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    left: 0;
    top: 0;
    transition: left 0.05s ease-out, top 0.05s ease-out;}


  </style>
  
</head>
<body>
  {% include 'navbar.html' %}

  <!-- Main Content -->
  <div class="container mt-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
  <div id="custom-cursor"></div>
  
  <!-- Footer -->
  <footer class="footer text-center py-3">
    <p>&copy; Adoptify {% now "Y" %}</p>
  </footer>

  
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/custom.js' %}"></script>
  <script>
    const cursor = document.getElementById('custom-cursor');
  
    let mouseX = 0, mouseY = 0;
    let catX = 0, catY = 0;
  
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
  
      // Move the custom cursor
      cursor.style.left = mouseX - 8 + 'px'; // Half width of cursor
      cursor.style.top = mouseY - 8 + 'px';
    });
  
    function animateCat() {
      catX += (mouseX - catX) * 0.1;
      catY += (mouseY - catY) * 0.1;
  
      // Move the cat to follow with delay and offset
      cat.style.left = catX - 30 + 'px'; // Half width of cat image
      cat.style.top = catY - 30 + 'px';
      requestAnimationFrame(animateCat);
    }
  
    animateCat();
  </script>
  
</body>
</html>
